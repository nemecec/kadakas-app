# Settings for cargo-about. `scripts/notices.sh` makes THIRD_PARTY_NOTICES.txt from them.
# Keep `accepted` in line with `licenses.allow` in deny.toml.

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

# What we ship: the desktop installers and the web build.
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false
# The crates of Kadakas itself are not third party.
private = { ignore = true }
