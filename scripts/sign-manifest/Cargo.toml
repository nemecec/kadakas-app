[package]
name = "kadakas-sign-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CI tool for the Kadakas launcher: builds an update manifest from archives and signs it with an ed25519 key. The launcher never has this code."
publish = false

[[bin]]
name = "sign-manifest"
path = "src/main.rs"

[dependencies]
kadakas-sys = { version = "0.1.0", path = "../../crates/kadakas-sys" }
kadakas-update = { version = "0.1.0", path = "../../crates/kadakas-update", features = ["sign"] }
getrandom = "0.4.3"
serde_json = "1.0.151"
