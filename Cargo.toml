[workspace]
resolver = "2"
members = ["crates/*", "scripts/sign-manifest"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/nemecec/kadakas-app"
version = "0.1.0-dev"
# Nothing is published to crates.io. cargo-deny then allows path dependencies without a version.
publish = false

# Keep build folders small: line tables for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A little optimization makes the CPU-heavy crates much faster in tests (rasterizer, geometry,
# section drawings, page composition) at a small cost for the build.
[profile.dev.package.kadakas-render]
opt-level = 1
[profile.dev.package.kadakas-core]
opt-level = 1
[profile.dev.package.kadakas-print]
opt-level = 1
[profile.dev.package.kadakas-x3d]
opt-level = 1
# The Cranelift compiler of the plug-in engine is slow without optimization. Tests of plug-ins
# compile modules, so a little optimization saves a lot of test time.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
