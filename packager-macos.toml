# Installer settings for cargo-packager. See docs/release.md.
#
#   cargo install cargo-packager --locked
#   cargo build --release -p kadakas-app -p kadakas-modeler -p kadakas-cli -p kadakas-launcher
#   scripts/macos-app.sh target/release dist-app                                # macOS: the inner app
#   cargo packager --release --config packager-macos.toml --formats app,dmg   # macOS (this file)
#   cargo packager --release --formats nsis,wix         # Windows
#   cargo packager --release --formats appimage,deb     # Linux
#
# The installers are not signed. Signing is a TODO (docs/release.md). The launcher's update
# archives are different: the launcher checks them with an ed25519-signed manifest
# (.github/workflows/update-manifest.yml, docs/release.md).

# The package name. Set here so cargo-packager need not look for a Cargo.toml.
name = "kadakas"
product-name = "Kadakas"
identifier = "net.kadakas.Kadakas"
version = "0.1.0-beta.1"
description = "CAD for landscape architects"
authors = ["The Kadakas authors"]
homepage = "https://github.com/nemecec/kadakas-app"
license-file = "LICENSE-APACHE"
category = "Graphics and Design"

# The installers go to dist/. The release binaries come from target/release.
# With another CARGO_TARGET_DIR, pass --binaries-dir <that folder>/release.
out-dir = "dist"
binaries-dir = "target/release"

# macOS (PLAT-16): two bundles, one inside the other.
#
# - The outer `Kadakas.app` is what is installed. Its main executable is the launcher: the Dock,
#   Finder and Launchpad start it, and Finder sends it the open-documents Apple event of a double
#   click on a `.kad` file (the launcher passes the file on to the app that runs). It has no
#   window and no Dock icon (`background-app`, `LSUIElement`), so the person sees only the app.
# - The inner `Kadakas Engine.app` (`Contents/MacOS/Kadakas Engine.app`) is the app: its main executable is
#   `kadakas-app`, and its own `Info.plist` gives the name, the icon and the Dock tile. It is the
#   base version: the launcher starts it when no update is installed, and it is never deleted.
#   `scripts/macos-app.sh` makes it, and the update archive is the same bundle, so an update is a
#   whole `.app` too. The packager signs it as a bundle of its own when a signing identity is set.
#
# Run `scripts/macos-app.sh target/release dist-app` before `cargo packager`. The `kadakas`
# command line tool is next to the launcher, so agents find it at a fixed place.
binaries = [
  { path = "kadakas-launcher", main = true },
  { path = "kadakas" },
]

# The license texts of Kadakas and of all libraries in it. Every installer ships these files
# (THIRD_PARTY_NOTICES.txt comes from scripts/notices.sh).
resources = ["THIRD_PARTY_NOTICES.txt", "docs/attribution.md", "LICENSE-APACHE", "LICENSE-MIT"]

icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/64x64.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]

# Kadakas documents end in .kad.
[[file-associations]]
extensions = ["kad"]
name = "Kadakas drawing"
description = "Kadakas drawing"
mime-type = "application/vnd.kadakas.drawing+zip"
role = "editor"

[macos]
minimum-system-version = "11.0"
# Made by scripts/macos-app.sh from packaging/macos/Info.plist (the version keys). Run the script first.
info-plist-path = "dist-app/Info.plist"
background-app = true
embedded-apps = ["dist-app/Kadakas Engine.app"]

[dmg]
window-size = { width = 540, height = 380 }
app-position = { x = 140, y = 190 }
application-folder-position = { x = 400, y = 190 }

[nsis]
installer-icon = "packaging/icons/icon.ico"
installer-mode = "both"

[deb]
depends = ["libxkbcommon0", "libgtk-3-0"]
section = "graphics"
