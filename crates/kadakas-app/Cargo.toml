[package]
name = "kadakas-app"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["script-js"]
# The JavaScript engine (SCR-08). Needs a wasi-sdk to build, see docs/dev-guide.md.
script-js = ["kadakas-api/script-js"]
# The browser test hook (`window.kadakasTest`, see `collab_ui.rs`). Off by default: only
# `scripts/test-browser.sh` of kadakas-server builds the web build with it.
test-hook = []

[dependencies]
base64 = "0.22.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
kadakas-annot = { path = "../kadakas-annot" }
kadakas-api = { path = "../kadakas-api", default-features = false }
kadakas-irrigation = { path = "../kadakas-irrigation" }
kadakas-collab-ws = { path = "../kadakas-collab-ws" }
kadakas-print = { path = "../kadakas-print" }
kadakas-core = { path = "../kadakas-core" }
kadakas-plants = { path = "../kadakas-plants" }
kadakas-plugin = { path = "../kadakas-plugin" }
kadakas-script-js = { path = "../kadakas-script-js" }
kadakas-l10n = { path = "../kadakas-l10n" }
kadakas-units = { path = "../kadakas-units" }
kadakas-ui-core = { path = "../kadakas-ui-core" }
kadakas-view3d = { path = "../kadakas-view3d" }
kadakas-sys = { path = "../kadakas-sys" }
kadakas-render = { path = "../kadakas-render" }
kadakas-review = { path = "../kadakas-review" }
kadakas-feedback = { path = "../kadakas-feedback" }
kadakas-crash = { path = "../kadakas-crash" }
kadakas-file = { path = "../kadakas-file" }
kadakas-sheet = { path = "../kadakas-sheet" }
kadakas-site = { path = "../kadakas-site" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.35.0"
egui_dock = { version = "0.20.1", features = ["serde"] }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = { version = "0.15", features = ["file-handle-inner"] }
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4.3"
kadakas-gis = { path = "../kadakas-gis" }
kadakas-script = { path = "../kadakas-script" }
kadakas-update = { path = "../kadakas-update" }
# The panic hook and the native crash handler (PLAT-20).
kadakas-crash = { path = "../kadakas-crash", features = ["capture"] }
sys-locale = "0.3.2"

# The web build: WebGPU first, WebGL2 as the fallback (eframe picks at start).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "29", default-features = false, features = ["webgpu", "webgl"] }
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlCanvasElement", "Storage", "Crypto", "Navigator", "Location", "History", "Event", "EventTarget", "BeforeUnloadEvent", "File"] }
js-sys = "0.3"

[dev-dependencies]
pollster = "1.0.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
kadakas-collab-ws = { path = "../kadakas-collab-ws", features = ["test-server"] }
kadakas-collab = { path = "../kadakas-collab", features = ["testkit"] }
