[package]
name = "kadakas-ifc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
kadakas-crs = { version = "0.1.0", path = "../kadakas-crs" }
kadakas-sys = { version = "0.1.0", path = "../kadakas-sys" }
kadakas-step = { version = "0.1.0", path = "../kadakas-step" }
kadakas-io = { version = "0.1.0", path = "../kadakas-io" }
kadakas-site = { version = "0.1.0", path = "../kadakas-site" }
i_overlay = "9.0.1"
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
proptest = "1.11.0"
