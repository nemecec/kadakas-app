[package]
name = "kadakas-step"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "STEP files for Kadakas (IOP-11): the Part 21 reader and writer, and the import of B-rep geometry (AP203, AP214, AP242) as tessellated parts. Pure Rust, no file access."

[dependencies]
kadakas-core = { path = "../kadakas-core" }
kadakas-meshio = { path = "../kadakas-meshio" }
glam = "0.34.1"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
