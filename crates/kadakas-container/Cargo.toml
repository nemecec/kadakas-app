[package]
name = "kadakas-container"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ZIP container of a Kadakas file (DOC-20): a bounded reader with a manifest of sizes and SHA-256 hashes, a streaming writer that can copy entries without decoding them, and part sources for lazy reads. Pure and wasm-compatible; the file source is native only. It knows nothing of documents."

[dependencies]
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
