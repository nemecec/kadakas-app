[package]
name = "kadakas-props"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The property model of a Kadakas document: things by Uid with properties, operations on them, the merge rules and a total build of a document. Shared by collaboration and review. Pure and wasm-compatible."

[features]
# Only for tests/limits_measure.rs: the limits of the surface model can be raised for a measurement.
measure-limits = ["kadakas-core/measure-limits"]

[dependencies]
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
# Only for tests/limits_measure.rs (the measurement of collaboration updates).
glam = "0.34.1"
