[package]
name = "kadakas-props"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The property model of a Kadakas document: things by Uid with properties, operations on them, the merge rules and a total build of a document. Shared by collaboration and review. Pure and wasm-compatible."

[dependencies]
kadakas-core = { path = "../kadakas-core" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
# Only for tests/limits_measure.rs (the measurement of collaboration updates).
glam = "0.34.1"

[lints.rust]
# Set only by RUSTFLAGS in the measurement of the limits (see `kadakas-core`).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kadakas_measure)'] }
