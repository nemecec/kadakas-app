[package]
name = "cadektor-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scripting for Cadektor: Python discovery, safe process runs, plug-in object definitions and the reset protocol, and the script host for the Scripts palette. Native only."

[dependencies]
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-sys = { version = "0.1.0", path = "../cadektor-sys" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
tempfile = "3"

