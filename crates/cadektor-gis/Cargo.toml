[package]
name = "cadektor-gis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GIS services for Cadektor: WMS and WMTS map backgrounds, WFS import, geoimages and coordinate conversion. Native only."

[dependencies]
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-io = { version = "0.1.0", path = "../cadektor-io" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tiff = "0.11.3"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
proptest = "1.11.0"
