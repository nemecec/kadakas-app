[package]
name = "kadakas-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform helpers for Kadakas: atomic file writes, process groups, process checks, per-user folders and private temporary folders. For native code; it has no document types."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
