[package]
name = "kadakas-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Review of a Kadakas document: named versions kept as a base snapshot and deltas of property operations, and the diff between two versions. Pure and wasm-compatible; no I/O."

[dependencies]
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
kadakas-props = { version = "0.1.0", path = "../kadakas-props" }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
