[package]
name = "kadakas-plugin"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The host for Kadakas WebAssembly plug-ins: a runtime-neutral interface, trust by module hash, limits and checks of the answer. The wasmtime backend is native only; the browser build has a stub."

[features]
# A plain wasmtime compiler for the metered engine (the engine of the browser), to test that engine
# on the desktop. For the tests of this workspace only.
testkit = []

[dependencies]
kadakas-core = { path = "../kadakas-core" }
kadakas-plugin-abi = { path = "../kadakas-plugin-abi" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
# Rewrites a module before it is compiled (limits for the browser engine). Pure.
wasm-encoder = { version = "0.262.0", default-features = false, features = ["std", "wasmparser"] }
# Reads the structure of a module (function sizes, locals) before it is compiled. Pure.
wasmparser = { version = "0.262.0", default-features = false, features = ["std", "validate", "features", "simd"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kadakas-sys = { path = "../kadakas-sys" }
# Only what we need: the runtime and the Cranelift compiler. No WASI, no cache, no async, no text format.
wasmtime = { version = "49.0.4", default-features = false, features = ["std", "runtime", "cranelift"] }

# The browser engine: the WebAssembly API of the page, and its localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
# Test modules are written as text (WAT) and compiled in the tests. Not shipped.
wat = "1"
