[package]
name = "kadakas-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Kadakas launcher: the entry point of Kadakas. Starts the chosen version at once, checks for signed updates in the background, keeps the version store (window: versions, channel, flavor, profile; command: add a local build). Native only. It holds public keys only."

[[bin]]
name = "kadakas-launcher"
path = "src/main.rs"

[dependencies]
kadakas-sys = { version = "0.1.0", path = "../kadakas-sys" }
kadakas-l10n = { version = "0.1.0", path = "../kadakas-l10n" }
kadakas-update = { version = "0.1.0", path = "../kadakas-update" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.35.0"
sys-locale = "0.3.2"

# macOS: the open-documents Apple event of a double click on a .kad file (PLAT-16). The same
# versions as winit uses, so no second copy is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSNotification", "NSObject", "NSString", "NSURL"] }
