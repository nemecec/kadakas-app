[package]
name = "kadakas-ui-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What every Kadakas UI program needs, without egui: tool state machines, picking, snapping glue, view state and keymaps. Pure and wasm-compatible."

[dependencies]
kadakas-core = { path = "../kadakas-core" }
kadakas-annot = { path = "../kadakas-annot" }
kadakas-l10n = { path = "../kadakas-l10n" }
kadakas-units = { path = "../kadakas-units" }
kadakas-feedback = { path = "../kadakas-feedback" }
kadakas-irrigation = { path = "../kadakas-irrigation" }
kadakas-plants = { path = "../kadakas-plants" }
kadakas-render = { path = "../kadakas-render" }
kadakas-site = { path = "../kadakas-site" }
kadakas-review = { path = "../kadakas-review", default-features = false }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1.11.0"
