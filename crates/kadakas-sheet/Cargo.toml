[package]
name = "kadakas-sheet"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Worksheets: a spreadsheet grid with formulas and database rows over document objects. Pure and wasm-compatible."

[dependencies]
kadakas-core = { path = "../kadakas-core" }
kadakas-plants = { path = "../kadakas-plants" }
kadakas-units = { path = "../kadakas-units" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1.11.0"
