[package]
name = "kadakas-view3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The 3D view that the UI programs share: the GPU drawing of the scene (wgpu), the vertex types and the view state with its caches. Used by kadakas-app and kadakas-modeler."

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
kadakas-render = { version = "0.1.0", path = "../kadakas-render" }
kadakas-ui-core = { version = "0.1.0", path = "../kadakas-ui-core" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu"] }
egui = "0.35.0"
glam = { version = "0.34.1", features = ["serde"] }

[dev-dependencies]
pollster = "1.0.1"
kadakas-api = { version = "0.1.0", path = "../kadakas-api", default-features = false }
kadakas-review = { version = "0.1.0", path = "../kadakas-review", default-features = false }
serde_json = "1.0.151"
