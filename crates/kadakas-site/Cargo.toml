[package]
name = "kadakas-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Site model (terrain): TIN, contours, slope, site modifiers and cut and fill volumes."

[dependencies]
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
spade = "2.15.1"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
