[package]
name = "kadakas-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
kadakas-annot = { version = "0.1.0", path = "../kadakas-annot" }
kadakas-collab = { version = "0.1.0", path = "../kadakas-collab" }
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
kadakas-plants = { version = "0.1.0", path = "../kadakas-plants" }
kadakas-crs = { version = "0.1.0", path = "../kadakas-crs" }
kadakas-feedback = { version = "0.1.0", path = "../kadakas-feedback" }
kadakas-irrigation = { version = "0.1.0", path = "../kadakas-irrigation" }
kadakas-plugin = { version = "0.1.0", path = "../kadakas-plugin" }
kadakas-plugin-abi = { version = "0.1.0", path = "../kadakas-plugin-abi" }
kadakas-render = { version = "0.1.0", path = "../kadakas-render" }
kadakas-review = { version = "0.1.0", path = "../kadakas-review" }
kadakas-sheet = { version = "0.1.0", path = "../kadakas-sheet" }
kadakas-site = { version = "0.1.0", path = "../kadakas-site" }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kadakas-sys = { version = "0.1.0", path = "../kadakas-sys" }
kadakas-print = { version = "0.1.0", path = "../kadakas-print" }
kadakas-io = { version = "0.1.0", path = "../kadakas-io" }
kadakas-ifc = { version = "0.1.0", path = "../kadakas-ifc" }
kadakas-x3d = { version = "0.1.0", path = "../kadakas-x3d" }
kadakas-gis = { version = "0.1.0", path = "../kadakas-gis" }
kadakas-script = { version = "0.1.0", path = "../kadakas-script" }
tempfile = "3"

[dev-dependencies]
# The tests make a command panic (`kadakas_core::fault`). Not shipped.
kadakas-core = { version = "0.1.0", path = "../kadakas-core", features = ["fault-injection"] }
png = "0.18"
# Encodes JPEG in the snapshot benchmark only (to compare sizes).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Draws the SVG of a compare to pixels in the tests. The app ships it already. Not shipped here.
resvg = { version = "0.48.1", default-features = false }
proptest = "1.11.0"
# Makes hostile BCF archives in the tests. Not shipped here (kadakas-review reads them).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
kadakas-collab = { version = "0.1.0", path = "../kadakas-collab", features = ["testkit"] }
# The in-process WebSocket server for tests of `collab.connect {url}`. Not shipped.
kadakas-collab-ws = { version = "0.1.0", path = "../kadakas-collab-ws", features = ["test-server"] }
# Test modules for the limits are written as text. Not shipped.
wat = "1"
