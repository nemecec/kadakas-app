[package]
name = "cadektor-api"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-render = { version = "0.1.0", path = "../cadektor-render" }
cadektor-site = { version = "0.1.0", path = "../cadektor-site" }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cadektor-print = { version = "0.1.0", path = "../cadektor-print" }

[dev-dependencies]
png = "0.18"
