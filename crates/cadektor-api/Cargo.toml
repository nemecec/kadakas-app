[package]
name = "cadektor-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
cadektor-annot = { version = "0.1.0", path = "../cadektor-annot" }
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-plants = { version = "0.1.0", path = "../cadektor-plants" }
cadektor-crs = { version = "0.1.0", path = "../cadektor-crs" }
cadektor-sys = { version = "0.1.0", path = "../cadektor-sys" }
cadektor-irrigation = { version = "0.1.0", path = "../cadektor-irrigation" }
cadektor-render = { version = "0.1.0", path = "../cadektor-render" }
cadektor-sheet = { version = "0.1.0", path = "../cadektor-sheet" }
cadektor-site = { version = "0.1.0", path = "../cadektor-site" }
glam = { version = "0.34.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cadektor-print = { version = "0.1.0", path = "../cadektor-print" }
cadektor-io = { version = "0.1.0", path = "../cadektor-io" }
cadektor-ifc = { version = "0.1.0", path = "../cadektor-ifc" }
cadektor-x3d = { version = "0.1.0", path = "../cadektor-x3d" }
cadektor-gis = { version = "0.1.0", path = "../cadektor-gis" }
cadektor-script = { version = "0.1.0", path = "../cadektor-script" }
tempfile = "3"

[dev-dependencies]
png = "0.18"
