[package]
name = "cadektor-print"
version = "0.1.0"
edition = "2024"
description = "Sheet composition and output: PDF, SVG and PNG. Native only."

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.22.1"
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-render = { version = "0.1.0", path = "../cadektor-render" }
cadektor-sheet = { version = "0.1.0", path = "../cadektor-sheet" }
cadektor-site = { version = "0.1.0", path = "../cadektor-site" }
epaint_default_fonts = "0.35.0"
glam = { version = "0.34.1" }
miniz_oxide = "0.8.9"
pdf-writer = "0.15.0"
png = "0.18"
tiny-skia = "0.12.0"

[dev-dependencies]
lopdf = "0.45.0"
proptest = "1.11.0"
serde_json = "1.0.151"
