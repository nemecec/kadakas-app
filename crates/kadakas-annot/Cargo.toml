[package]
name = "kadakas-annot"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Annotation with data: tag fields, legends and the output of annotations. Pure and wasm-compatible."

[dependencies]
kadakas-core = { path = "../kadakas-core" }
kadakas-sheet = { path = "../kadakas-sheet" }
glam = { version = "0.34.1", features = ["serde"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1.11.0"
