[package]
name = "kadakas-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A test can make the next command panic after its first change (`fault::arm`). Not for release.
fault-injection = []

[dependencies]
glam = { version = "0.34.1", features = ["serde"] }
i_overlay = "9.0.1"
png = "0.18"
sha2 = "0.11.0"
indexmap = { version = "2.14.2", features = ["serde"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
kadakas-units = { path = "../kadakas-units" }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"

[lints.rust]
# `kadakas_measure` is set only by RUSTFLAGS in the measurement of the limits
# (`crates/kadakas-core/tests/limits_campaign.sh`). It is not a feature, so no dependency can turn it on.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kadakas_measure)'] }
