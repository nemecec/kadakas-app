[package]
name = "kadakas-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A test can make the next command panic after its first change (`fault::arm`). Not for release.
fault-injection = []
# The limits of a surface model (vertices, edges, faces, loop vertices) can be multiplied by a factor
# (`surface::set_limit_scale`), to measure what the limits would cost if they were raised
# (`docs/modeler-limits.md`). The factor is 1 and cannot change without this feature. Not for release.
measure-limits = []

[dependencies]
glam = { version = "0.34.1", features = ["serde"] }
i_overlay = "9.0.1"
png = "0.18"
sha2 = "0.10.9"
indexmap = { version = "2.14.2", features = ["serde"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
kadakas-units = { version = "0.1.0", path = "../kadakas-units" }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"
