[package]
name = "cadektor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cadektor-annot = { version = "0.1.0", path = "../cadektor-annot" }
cadektor-api = { version = "0.1.0", path = "../cadektor-api" }
cadektor-irrigation = { version = "0.1.0", path = "../cadektor-irrigation" }
cadektor-print = { version = "0.1.0", path = "../cadektor-print" }
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-render = { version = "0.1.0", path = "../cadektor-render" }
cadektor-sheet = { version = "0.1.0", path = "../cadektor-sheet" }
cadektor-site = { version = "0.1.0", path = "../cadektor-site" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.35.0"
glam = { version = "0.34.1", features = ["serde"] }
serde_json = "1.0.151"
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4.3"
cadektor-gis = { version = "0.1.0", path = "../cadektor-gis" }
cadektor-script = { version = "0.1.0", path = "../cadektor-script" }

# The web build: WebGPU first, WebGL2 as the fallback (eframe picks at start).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "29", default-features = false, features = ["webgpu", "webgl"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage"] }

[dev-dependencies]
pollster = "1.0.1"
