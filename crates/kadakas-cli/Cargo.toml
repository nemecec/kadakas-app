[package]
name = "kadakas-cli"
default-run = "kadakas"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["script-js"]
# The JavaScript engine (SCR-08). Needs a wasi-sdk to build, see docs/dev-guide.md.
script-js = ["kadakas-api/script-js"]

[dependencies]
kadakas-api = { path = "../kadakas-api", default-features = false }
kadakas-core = { path = "../kadakas-core" }
kadakas-feedback = { path = "../kadakas-feedback" }
kadakas-file = { path = "../kadakas-file" }
kadakas-sys = { path = "../kadakas-sys" }
clap = { version = "4.6.7", features = ["derive", "env"] }
kadakas-collab-ws = { path = "../kadakas-collab-ws" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
kadakas-collab-ws = { path = "../kadakas-collab-ws", features = ["test-server"] }
kadakas-collab = { path = "../kadakas-collab", features = ["testkit"] }

[[bin]]
name = "kadakas"
path = "src/main.rs"
