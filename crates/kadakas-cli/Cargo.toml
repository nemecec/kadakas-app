[package]
name = "kadakas-cli"
default-run = "kadakas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kadakas-api = { version = "0.1.0", path = "../kadakas-api" }
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
kadakas-feedback = { version = "0.1.0", path = "../kadakas-feedback" }
kadakas-sys = { version = "0.1.0", path = "../kadakas-sys" }
clap = { version = "4.6.7", features = ["derive", "env"] }
kadakas-collab-ws = { version = "0.1.0", path = "../kadakas-collab-ws" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
kadakas-collab-ws = { version = "0.1.0", path = "../kadakas-collab-ws", features = ["test-server"] }
kadakas-collab = { version = "0.1.0", path = "../kadakas-collab", features = ["testkit"] }

[[bin]]
name = "kadakas"
path = "src/main.rs"
