[package]
name = "kadakas-collab-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A WebSocket transport and endpoint for the Kadakas collaboration client: a small blocking client with a reader thread (native, ws and wss with rustls) and a browser WebSocket (wasm32)."

[features]
# Also trust the root certificates of the operating system (the list of Mozilla roots from
# webpki-roots is always trusted).
native-roots = ["dep:rustls-native-certs"]
# A small in-process WebSocket server on top of the reference sequencer of kadakas-collab's
# testkit, for tests of this crate and of crates that use it (native only). Not a server.
test-server = ["kadakas-collab/testkit"]

[dependencies]
kadakas-collab = { version = "0.1.0", path = "../kadakas-collab" }
kadakas-core = { version = "0.1.0", path = "../kadakas-core" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Event", "BinaryType"] }

[dev-dependencies]
kadakas-collab-ws = { path = ".", features = ["test-server"] }
# A certificate for the TLS test (ring, not aws-lc).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
