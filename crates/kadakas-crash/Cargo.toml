[package]
name = "kadakas-crash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crash reports of Kadakas (PLAT-20): the crash file, the scrubbing of paths and names, the signature, the queue of kept reports and the report that goes through the feedback channel. The capture (panic hook, native crash handler) is native only and sits behind the feature `capture`."

[features]
# The panic hook and the native crash handler. The app enables it; the launcher does not.
capture = ["dep:crash-handler", "dep:libc"]

[dependencies]
kadakas-feedback = { version = "0.1.0", path = "../kadakas-feedback" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kadakas-sys = { version = "0.1.0", path = "../kadakas-sys" }
crash-handler = { version = "0.8.1", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# The tests of the capture need the feature; this turns it on for them only.
kadakas-crash = { path = ".", features = ["capture"] }
proptest = "1.11.0"
