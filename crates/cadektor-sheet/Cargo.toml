[package]
name = "cadektor-sheet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Worksheets: a spreadsheet grid with formulas and database rows over document objects. Pure and wasm-compatible."

[dependencies]
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-plants = { version = "0.1.0", path = "../cadektor-plants" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1.11.0"
