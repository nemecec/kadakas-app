[package]
name = "cadektor-annot"
version = "0.1.0"
edition = "2024"
description = "Annotation with data: tag fields, legends and the output of annotations. Pure and wasm-compatible."

[dependencies]
cadektor-core = { version = "0.1.0", path = "../cadektor-core" }
cadektor-sheet = { version = "0.1.0", path = "../cadektor-sheet" }
glam = { version = "0.34.1", features = ["serde"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1.11.0"
