[package]
name = "kadakas-crs"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Coordinate reference systems for Kadakas: parsing of EPSG codes, PROJ strings and WKT, the axis order table, point transforms, meridian convergence and true north. Pure Rust."

[dependencies]
kadakas-core = { path = "../kadakas-core" }

# The azimuthal equidistant projection needs a C compiler for the geodesic code, which the
# browser build does not have. Without it the crate is still wasm-compatible.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proj4rs = { version = "0.2.1", features = ["crs-definitions"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
proj4rs = { version = "0.2.1", default-features = false, features = ["crs-definitions"] }

[dev-dependencies]
proptest = "1.11.0"
