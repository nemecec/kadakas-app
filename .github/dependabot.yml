# Dependabot version updates. Security updates are on in the repository settings and work
# without this file. These rules make the routine updates few and quiet:
# - Grouped: all minor and patch updates of an ecosystem come in one pull request, and all
#   major updates in a second one. No pull request for each dependency.
# - Cooldown: a new version waits 7 days after its release before Dependabot proposes it.
#   Security updates ignore the cooldown, so a fix for a known vulnerability is never late.
# Each pull request runs the CI, so keep the number low.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Tallinn
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      rust-major:
        patterns: ["*"]
        update-types: [major]
    # The UI and graphics stack moves together. A major update of one of them needs a person.
    ignore:
      - dependency-name: "wgpu*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "egui*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wasmtime*"
        update-types: ["version-update:semver-major"]
      # wasm-encoder and wasmparser follow wasmtime: wasmtime 49 depends on the same 0.258
      # version, and a different direct version would give two copies in the tree.
      - dependency-name: "wasm-encoder"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wasmparser"
        update-types: ["version-update:semver-major"]
      # epaint_default_fonts follows egui: it must be the version that epaint uses, or the
      # fonts of the UI would exist twice.
      - dependency-name: "epaint_default_fonts"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Tallinn
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
