name: CI
# Actions are pinned to commit SHAs, as in release.yml. To update one, look up the new SHA of its tag
# and change the comment.
on:
  push:
  pull_request:
  # Run it by hand: Actions tab, or `gh workflow run ci.yml`.
  workflow_dispatch:

# A newer push to the same branch stops the older run, which saves minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # One failing system must not hide the results of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/wasi-sdk
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --keep-going --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: cargo build -p kadakas-cli
      # UTF-8 mode: files and pipes are UTF-8 on Windows too, not the code page of the system.
      - run: uv run --with pytest --with ezdxf --with ifcopenshell pytest tests/behavior python/tests -q
        env:
          PYTHONUTF8: "1"
  # Timing tests (`#[ignore]`, see docs/dev-guide.md). They need a release build, so they do not run in `test`.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: ./.github/actions/wasi-sdk
      - run: PERF_SIZES=10000 cargo test --release -p kadakas-core -p kadakas-container -p kadakas-site -p kadakas-api -p kadakas-io -- --ignored
  # A short run of the fuzzer of the container reader (crates/kadakas-container/tests/fuzz_open.rs):
  # changed containers must be errors, never panics. The seed is printed; KADAKAS_FUZZ_SEED repeats a run.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: KADAKAS_FUZZ_SECS=60 cargo test --release -p kadakas-container --test fuzz_open -- --nocapture
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasi-sdk
      - run: cargo check -p kadakas-units -p kadakas-l10n -p kadakas-core -p kadakas-container -p kadakas-file -p kadakas-props -p kadakas-review -p kadakas-collab -p kadakas-collab-ws -p kadakas-render -p kadakas-api -p kadakas-site -p kadakas-annot -p kadakas-x3d -p kadakas-meshio -p kadakas-step -p kadakas-ui-core -p kadakas-view3d -p kadakas-plugin-abi -p kadakas-plugin -p kadakas-script-js -p kadakas-feedback -p kadakas-crash -p kadakas-app --target wasm32-unknown-unknown
  # Test-only features (fault-injection) must not be in a program that we ship.
  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: scripts/check-test-hook.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasi-sdk
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: trunk
      - run: trunk build
  # The rule of docs/dev-guide.md: every library crate keeps 95% of its lines or more. The command
  # line crate has a bar of 90%. The app crate is left out (window code). See scripts/coverage.sh.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/wasi-sdk
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov
      - run: scripts/coverage.sh
  # Licenses, known security problems and sources of all dependencies. See deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check
  # Every shipped asset, dataset, vendored file and Cargo dependency needs a row (PLAT-21).
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # The script reads Cargo data offline. Fetch the sources first.
      - run: cargo fetch --locked
      - run: scripts/check-attribution.sh
      - run: scripts/tests/test_check_attribution.sh
  # THIRD_PARTY_NOTICES.txt must match the dependencies. The installers ship it (packager.toml).
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-about
      - run: scripts/notices.sh
      - name: THIRD_PARTY_NOTICES.txt is up to date
        run: |
          if ! git diff --exit-code THIRD_PARTY_NOTICES.txt; then
            echo "Run scripts/notices.sh and commit THIRD_PARTY_NOTICES.txt"
            exit 1
          fi
