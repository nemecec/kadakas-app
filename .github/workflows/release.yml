name: Release
# Builds the installers when a version tag is pushed (for example v0.1.0).
# Nothing is signed yet. See docs/release.md.
# Actions are pinned to commit SHAs. To update one, look up the new SHA of its tag and change the comment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs get read access only. The publish job asks for more.
permissions:
  contents: read

env:
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon
            formats: app,dmg
            name: macos-arm64
          - os: macos-15-intel # Intel
            formats: app,dmg
            name: macos-x86_64
          - os: windows-latest
            formats: nsis,wix
            name: windows-x86_64
          - os: ubuntu-22.04
            formats: appimage,deb
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libfuse2 file
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-about
      - name: Make THIRD_PARTY_NOTICES.txt (the installers ship it)
        shell: bash
        run: scripts/notices.sh
      - name: Build the app and the cadektor command line tool
        run: cargo build --release -p cadektor-app -p cadektor-cli
      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cadektor-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: trunk
      - run: trunk build --release
      - run: tar -czf cadektor-web.tar.gz -C dist-web .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cadektor-web
          path: cadektor-web.tar.gz

  publish:
    needs: [package, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: artifacts/*
