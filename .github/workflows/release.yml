name: Release
# Builds the installers when a version tag is pushed (for example v0.1.0).
# The installers are not signed yet. The update archives are checked by the launcher with the
# signed manifest, which .github/workflows/update-manifest.yml makes after a release is published.
# See docs/release.md.
# Actions are pinned to commit SHAs. To update one, look up the new SHA of its tag and change the comment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs get read access only. The publish job asks for more.
permissions:
  contents: read

env:
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

# Caches: Swatinem/rust-cache keeps the compiled dependencies of the release builds. A tag has
# its own cache scope and cannot share with other tags, so a tag run only restores the cache of
# main. To warm it, start this workflow by hand on main (`gh workflow run release.yml`): that run
# saves the caches, and it makes no release (publish needs a tag). Each cache is 0.6 to 1 GB, and
# the least recently used caches go first when the 10 GB limit of the repository is full.

jobs:
  package:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon
            formats: app,dmg
            config: packager-macos.toml
            name: macos-arm64
            platform: macos-aarch64
          - os: macos-15-intel # Intel
            formats: app,dmg
            config: packager-macos.toml
            name: macos-x86_64
            platform: macos-x86_64
          - os: windows-latest
            formats: nsis,wix
            config: packager.toml
            name: windows-x86_64
            platform: windows-x86_64
          - os: ubuntu-22.04
            formats: appimage,deb
            config: packager.toml
            name: linux-x86_64
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every place has the workspace version, and a tag run has the tag of that version.
      - name: Check the version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/check-version.sh
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" == *-* ]] && [[ "${REF_NAME#*-}" =~ ^dev(\.|$) ]]; then echo "::error::a development version is never released"; exit 1; fi
            ws=$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)
            [ "v$ws" = "$REF_NAME" ] || { echo "::error::tag $REF_NAME does not match the workspace version $ws"; exit 1; }
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
          cache-all-crates: false
          cache-bin: false
      # Releases are always built with the pinned wasi-sdk (not with a Homebrew toolchain).
      - uses: ./.github/actions/wasi-sdk
        with:
          cache-module: "false"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxkbcommon-dev libgtk-3-dev libfuse2 file
      # taiki-e/install-action has no cargo-packager, and the project publishes no programs for
      # it. So it is built once with `cargo install` into its own folder, and that folder is cached
      # (key: system and version).
      - name: Folder of cargo-packager
        shell: bash
        run: |
          home="$HOME"
          if command -v cygpath >/dev/null 2>&1; then home="$(cygpath -m "$HOME")"; fi
          echo "PACKAGER_ROOT=$home/.cargo-packager-bin" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: packager
        with:
          path: ~/.cargo-packager-bin
          key: cargo-packager-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PACKAGER_VERSION }}
      - name: Install cargo-packager
        if: steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }} --root "${{ env.PACKAGER_ROOT }}"
      - name: Put cargo-packager on the path
        shell: bash
        run: |
          echo "$PACKAGER_ROOT/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/cargo-about
      - name: Make THIRD_PARTY_NOTICES.txt (the installers ship it)
        shell: bash
        run: scripts/notices.sh
      - name: Build the app, the kadakas command line tool and the launcher
        run: cargo build --release -p kadakas-app -p kadakas-modeler -p kadakas-cli -p kadakas-launcher
      # macOS: the app is its own bundle, inside the bundle of the launcher (packager-macos.toml).
      # The same bundle is the update archive, so an update is a whole `.app`.
      - name: Make the app bundle (macOS)
        if: runner.os == 'macOS'
        run: scripts/macos-app.sh target/release dist-app
      # WiX (MSI) takes only numbers and Debian sorts 0.1.0-beta.1 after 0.1.0, so these two formats get
      # their own form of the version (scripts/packager-version.sh): 0.1.0-10001 and 0.1.0~beta.1.
      # The app, the manifest, the other installers and the tag keep 0.1.0-beta.1. A copy of the
      # packager config with the mapped version is used for that one format.
      - name: Package
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
          FORMATS: ${{ matrix.formats }}
        run: |
          set -euo pipefail
          ver=$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)
          special=""
          case "$RUNNER_OS" in Windows) special=wix ;; Linux) special=deb ;; esac
          plain="$FORMATS"
          if [ -n "$special" ]; then plain="${FORMATS//,$special/}"; fi
          cargo packager --release --config "$CONFIG" --formats "$plain"
          if [ -n "$special" ]; then
            mapped=$(scripts/packager-version.sh "$special" "$ver")
            echo "$special package version: $mapped (workspace version $ver)"
            sed "s/^version = .*/version = \"$mapped\"/" "$CONFIG" > "packager-$special.toml"
            grep -q "^version = \"$mapped\"" "packager-$special.toml"
            cargo packager --release --config "packager-$special.toml" --formats "$special"
          fi
      # TODO (PLAT-19): this archive is the bundle before signing. A release must sign it inside-out
      # (the programs, then the bundle) with the hardened runtime, notarize it and staple the
      # ticket, then pack it. The launcher does not set com.apple.quarantine on a download: the
      # ed25519 manifest carries the trust (docs/release.md).
      - name: Make the update archive of the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/kadakas-update-${{ matrix.platform }}.tar.gz" -C dist-app "Kadakas Engine.app"
      - name: Make the update archive (the launcher downloads this, not the installer)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          tar -czf "dist/kadakas-update-${{ matrix.platform }}.tar.gz" -C target/release "kadakas-app$ext" "kadakas-modeler$ext" "kadakas$ext"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kadakas-${{ matrix.name }}
          path: |
            dist/kadakas-update-*.tar.gz
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-web
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
          cache-all-crates: false
          cache-bin: false
      - uses: ./.github/actions/wasi-sdk
        with:
          cache-module: "false"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: trunk
      - run: trunk build --release
      - run: tar -czf kadakas-web.tar.gz -C dist-web .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kadakas-web
          path: kadakas-web.tar.gz

  publish:
    needs: [package, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The notes of the release are the section of this version in CHANGELOG.md. A pre-release
      # without a section gets generated notes. A stable release without a section is an error.
      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if .github/scripts/extract-changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-* ]]; then
            echo "::warning::CHANGELOG.md has no section for $version. The notes are generated."
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.has != 'true' }}
          # A version with a dash (0.1.0-beta.1) is a pre-release: update-manifest.yml finds the beta by this flag.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
